<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollinations.ai Music Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }
        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI 音楽ジェネレーター (Pollinations.ai)</h1>
    
    <label for="prompt">音楽のプロンプト（英語推奨）:</label>
    <input type="text" id="prompt" value="calm lo-fi chillhop beat with soft piano" placeholder="例: upbeat synthwave track with retro drums">
    
    <button id="generateBtn" onclick="generateMusic()">音楽を生成・再生</button>
    
    <div id="status" class="status"></div>

    <!-- 生成された音声がロード・再生されるプレーヤー -->
    <audio id="audioPlayer" controls style="display: none;"></audio>
</div>

<script>
    async function generateMusic() {
        const promptInput = document.getElementById('prompt');
        const btn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');

        const promptText = promptInput.value.trim();
        if (!promptText) {
            alert('プロンプトを入力してください。');
            return;
        }

        // UIの状態を更新
        btn.disabled = true;
        status.innerText = '音楽を生成中...（数秒〜十数秒かかります）';
        audioPlayer.style.display = 'none';

        // Pollinations.aiの音声エンドポイントURLを構築
        const encodedPrompt = encodeURIComponent(promptText);
        // キャッシュ回避用にタイムスタンプを付与
        const musicUrl = `https://pollinations.ai/p/${encodedPrompt}?model=audio&seed=${Date.now()}`;

        try {
            // Audio要素にURLをセットしてロード
            audioPlayer.src = musicUrl;
            
            // データの読み込み完了イベント待機
            audioPlayer.oncanplaythrough = () => {
                status.innerText = '生成完了！';
                btn.disabled = false;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
            };

            // エラーハンドリング
            audioPlayer.onerror = () => {
                status.innerText = '音楽の生成に失敗しました。プロンプトを変えて再度お試しください。';
                btn.disabled = false;
            };

        } catch (error) {
            console.error(error);
            status.innerText = 'エラーが発生しました。';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
